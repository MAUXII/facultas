<svg xmlns="http://www.w3.org/2000/svg" width="400" height="96" viewBox="0 0 400 96" role="img" aria-label="driftboard">
  <!-- driftboard wordmark stand-in (fictional example). Palette: card #f6f3ee, ink #2b2a28, accent #7c9a92. Opaque tile so it reads on light and dark. -->
  <rect width="400" height="96" rx="24" fill="#f6f3ee"/>
  <circle cx="52" cy="48" r="18" fill="#7c9a92"/>
  <rect x="40" y="58" width="30" height="10" rx="5" fill="#2b2a28" opacity="0.85"/>
  <text x="92" y="62" font-family="ui-rounded, 'SF Pro Rounded', ui-sans-serif, system-ui, sans-serif" font-size="40" font-weight="600" fill="#2b2a28" letter-spacing="-1">driftboard</text>
</svg>
