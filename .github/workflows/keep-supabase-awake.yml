# Mantém o projeto Supabase (free) acordado — ping periódico na API REST.
# Roda a cada 3 dias + manual (Actions → Run workflow).
#
# Secrets necessários no GitHub (Settings → Secrets → Actions):
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY

name: Keep Supabase awake

on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing secrets: NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY"
            exit 1
          fi
          # Trailing slash na raiz REST — resposta 200/401 ainda conta como atividade.
          code=$(curl -sS -o /tmp/supabase-ping-body -w "%{http_code}" \
            "${SUPABASE_URL%/}/rest/v1/" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP ${code}"
          case "${code}" in
            2*|401|404) exit 0 ;;
            *)
              head -c 400 /tmp/supabase-ping-body || true
              echo
              exit 1
              ;;
          esac
